name: Monitor (stop e alvo)

# A cada 10 min confere se alguma posição bateu stop ou alvo e registra o patrimônio.
# O GitHub às vezes atrasa o horário; não tem problema, a corretora repassa as velas perdidas.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estado
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Checar e registrar
        run: |
          git config user.name "monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tentativa in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            node corretora.mjs checar
            node corretora.mjs historico
            git add estado.json historico.jsonl diario.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -qm "monitor $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push -q origin HEAD:main; then exit 0; fi
            echo "push recusado (alguém gravou antes); refazendo"
            sleep 5
          done
          exit 1
